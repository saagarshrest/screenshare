name: Build & release

# Push a tag like v1.0.0 to build the installers and publish a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the installers to (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build app and DMG
        working-directory: mac
        env:
          MACSCREEN_ADHOC: "1"
        run: bash ./build.sh dmg
      - uses: actions/upload-artifact@v4
        with: { name: mac, path: mac/ShareScreen.dmg }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      # The Ubuntu runner already ships the Android SDK (ANDROID_HOME).
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../ShareScreen.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: ShareScreen.apk }

  release:
    needs: [mac, android]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
